version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: triply-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: triply
      POSTGRES_PASSWORD: triply_dev
      POSTGRES_DB: triply
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: triply-backend
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://triply:triply_dev@db:5432/triply
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - ./backend:/app
    command: >
      sh -c "flask db upgrade && python run.py"
    depends_on:
      db:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: triply-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:
