version: '3.8'

services:
  backend:
    build: ./backend
    container_name: triply-backend
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///triply.db
    volumes:
      - ./backend:/app
    command: python run.py

  frontend:
    build: ./frontend
    container_name: triply-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
