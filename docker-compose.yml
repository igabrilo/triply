version: '3.8'

services:
  backend:
    build: ./backend
    container_name: triply-backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=development
    volumes:
      - ./backend:/app
    command: >
      sh -c "flask db upgrade && python run.py"

  frontend:
    build: ./frontend
    container_name: triply-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host"
    depends_on:
      - backend
